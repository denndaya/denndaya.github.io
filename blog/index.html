<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Blog of Dennis Dayanikli" />
  <title>Dennis Dayanikli | Blog</title>
  <style>
    :root {
      --page-bg: #f8f5ef;
      --paper: rgba(255, 252, 246, 0.92);
      --text: #1f1b17;
      --muted: #6c6258;
      --rule: #d9d0c3;
      --link: #1f4f68;
      --link-hover: #13384b;
      --accent: #b88a5a;
      --shadow: 0 22px 50px rgba(66, 46, 23, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(184, 138, 90, 0.14), transparent 32%),
        linear-gradient(180deg, #fbf8f3 0%, var(--page-bg) 48%, #f3ede3 100%);
      line-height: 1.7;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      color: var(--link-hover);
      text-decoration: underline;
      text-underline-offset: 0.16em;
    }

    .page {
      width: min(860px, calc(100% - 2rem));
      margin: 2rem auto;
      padding: 2.75rem 2.5rem 3rem;
      background: var(--paper);
      border: 1px solid rgba(217, 208, 195, 0.8);
      box-shadow: var(--shadow);
      position: relative;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, var(--accent), rgba(184, 138, 90, 0.15));
    }

    h1,
    h2 {
      font-weight: 500;
      letter-spacing: 0.01em;
      margin: 0;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.3rem);
      line-height: 1.05;
      margin-bottom: 0.6rem;
    }

    .subtitle {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-size: 1.02rem;
    }

    nav {
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding: 0.85rem 0;
      margin: 1.5rem 0 2rem;
      color: var(--muted);
    }

    nav a {
      margin-right: 1rem;
      white-space: nowrap;
    }

    .empty-state {
      padding: 1.5rem 0 0;
    }

    .empty-state p {
      margin: 0 0 1rem;
      max-width: 60ch;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 720px) {
      .page {
        width: min(100%, calc(100% - 1rem));
        margin: 0.5rem auto;
        padding: 1.5rem 1.1rem 2rem;
      }

      nav a {
        display: inline-block;
        margin-bottom: 0.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Blog</h1>
      <p class="subtitle">Notes, thoughts, and future writing.</p>
    </header>

    <nav aria-label="Site navigation">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
    </nav>

    <main class="empty-state">
      <h2>No posts yet</h2>
      <p class="muted">
        This page is empty for now. Future posts will appear here.
      </p>
    </main>
  </div>
</body>
</html>
